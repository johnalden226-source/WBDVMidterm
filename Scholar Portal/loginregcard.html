<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLFU Student Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#006400,#228B22);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

.login-box h2{
    margin-bottom:20px;
    color:#006400;
}

.input-box{
    margin-bottom:15px;
    text-align:left;
}

.input-box label{
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

.login-btn{
    width:100%;
    padding:10px;
    background:#006400;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background:#004d00;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#555;
}
</style>

</head>

<body>

<div class="login-box">

<h2>OLFU Student Login</h2>

<form>

<div class="input-box">
<label>Student ID</label>
<input type="text" placeholder="Enter your Student ID" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Enter your Password" required>
</div>

<button class="login-btn">Login</button>

</form>

<div class="footer">
<p>Our Lady of Fatima University</p>
</div>

</div>

</body>
</html>
