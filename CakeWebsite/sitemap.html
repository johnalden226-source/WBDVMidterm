<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Velvet Crust - Site Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f7, #f8c8dc);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .sitemap-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(123, 30, 58, 0.2);
        }

        h1 {
            text-align: center;
            color: #7b1e3a;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .sitemap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node {
            width: 140px;
            height: 140px;
            background: linear-gradient(145deg, #ffe4ec, #f8c8dc);
            border: 4px solid #7b1e3a;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(123, 30, 58, 0.15);
            position: relative;
            font-weight: bold;
            color: #7b1e3a;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .node:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(123, 30, 58, 0.25);
            background: linear-gradient(145deg, #f8c8dc, #ffe4ec);
        }

        .node.home {
            width: 160px;
            height: 160px;
            font-size: 1.1em;
            background: linear-gradient(145deg, #7b1e3a, #a1354a);
            color: white;
            border-color: #ffe4ec;
        }

        .node.home:hover {
            background: linear-gradient(145deg, #a1354a, #7b1e3a);
        }

        .level-1 {
            display: flex;
            gap: 30px;
            margin: 40px 0;
        }

        .level-2 {
            display: flex;
            gap: 30px;
            margin: 30px 0;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #7b1e3a;
            margin: 0 auto;
            position: relative;
        }

        .arrow-down {
            border-top: none;
            border-bottom: 25px solid #7b1e3a;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            transform: rotate(180deg);
        }

        .line {
            width: 3px;
            height: 60px;
            background: #7b1e3a;
            margin: 0 auto;
            position: relative;
        }

        .level-1 .node {
            font-size: 0.9em;
        }

        .level-2 .node {
            width: 120px;
            height: 120px;
            font-size: 0.8em;
            padding: 10px;
        }

        .cake-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .level-1, .level-2 {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .node {
                width: 120px;
                height: 120px;
            }
            
            .node.home {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="sitemap-container">
        <h1>🍰 The Velvet Crust</h1>
        <p class="subtitle">Website Site Map</p>
        
        <div class="sitemap">
            <!-- Home (Top Level) -->
            <div class="node home">
                <div class="cake-icon">🏠</div>
                <div>Home</div>
            </div>
            
            <!-- Arrow down from Home -->
            <div class="arrow-down"></div>
            <div class="line"></div>
            
            <!-- Level 1 Navigation -->
            <div class="level-1">
                <div class="node">
                    <div>👥</div>
                    About
                </div>
                <div class="node">
                    <div>🍰</div>
                    Menu
                </div>
                <div class="node">
                    <div>🖼️</div>
                    Gallery
                </div>
                <div class="node">
                    <div>📝</div>
                    Order
                </div>
                <div class="node">
                    <div>📞</div>
                    Contact
                </div>
            </div>
            
            <!-- Arrow down to Order details -->
            <div class="arrow-down" style="margin-top: 20px;"></div>
            <div class="line" style="height: 40px;"></div>
            
            <!-- Level 2 (Order Form Details) -->
            <div class="level-2">
                <div class="node">
                    <div>📋</div>
                    Order Form
                </div>
                <div class="node">
                    <div>📅</div>
                    Cake Types
                </div>
                <div class="node">
                    <div>💬</div>
                    Messages
                </div>
                <div class="node">
                    <div>✉️</div>
                    Contact Info
                </div>
            </div>
            
            <!-- Footer -->
            <div style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #7b1e3a; width: 80%; text-align: center;">
                <div class="node" style="width: 200px; margin: 0 auto; background: #7b1e3a; color: white;">
                    📄 Footer
                </div>
                <p style="color: #7b1e3a; font-size: 0.9em; margin-top: 10px;">
                    Contact • Email • Copyright © 2026
                </p>
            </div>
        </div>
    </div>
</body>
</html>
