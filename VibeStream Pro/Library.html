<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Honkai Star Rail Peak Music</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#121212;
    color:white;
}

/* NAVIGATION */
nav{
    background:#000;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.logo{
    color:#1db954;
    font-size:20px;
    font-weight:bold;
}
nav input{
    padding:8px;
    border-radius:20px;
    border:none;
    width:220px;
    background:#282828;
    color:white;
}

/* CONTAINER */
.container{
    padding:20px;
}

.song-card{
    background:#181818;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:15px;
}

.song-card img{
    width:80px;
    height:80px;
    border-radius:10px;
}

.song-title{
    font-size:18px;
    font-weight:bold;
}

.artist{
    font-size:14px;
    color:#b3b3b3;
}

audio{
    width:100%;
    margin-top:8px;
}

footer{
    text-align:center;
    padding:15px;
    color:#aaa;
}
</style>
</head>

<body>

<!-- NAV BAR -->
<nav>
    <div class="logo">🎵 Peak Music</div>
    <input type="text" id="searchBar" placeholder="Search music..." onkeyup="searchSongs()">
</nav>

<div class="container" id="songList">

    <!-- SONG 1 -->
    <div class="song-card">
        <img src="https://via.placeholder.com/80">
        <div>
            <div class="song-title">Proi Proi</div>
            <div class="artist">Honkai Star Rail</div>
            <audio controls>
                <source src="proiproi.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- SONG 2 -->
    <div class="song-card">
        <img src="namelessfaces.jpeg">
        <div>
            <div class="song-title">Nameless Faces</div>
            <div class="artist">Honkai Star Rail</div>
            <audio controls>
                <source src="namelessfaces.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</div>

<footer>Welcome to Hoyo-Mix</footer>

<script>
function searchSongs(){
    let input = document.getElementById("searchBar").value.toLowerCase();
    let songs = document.querySelectorAll(".song-card");

    songs.forEach(song=>{
        let title = song.innerText.toLowerCase();
        song.style.display = title.includes(input) ? "flex" : "none";
    });
}
</script>

</body>
</html>
