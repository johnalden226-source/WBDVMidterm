<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Honkai Star Rail Peak Music - Login</title>
<style>
body{
margin:0;
font-family: Arial, Helvetica, sans-serif;
background:#121212;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.login-box{
background:#181818;
padding:40px;
border-radius:14px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
text-align:center;
}

h1{
color:#1db954;
margin-bottom:25px;
}
input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#282828;
color:white;
}
input:focus{
outline:2px solid #1db954;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:8px;
background:#1db954;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#17a74a;
}

.links{
margin-top:15px;
font-size:14px;
}
.links a{
color:#1db954;
text-decoration:none;
}

.links a:hover{
text-decoration:underline;
}

.footer{
margin-top:20px;
font-size:12px;
color:#aaa;
}
</style>
</head>

<body>

<div class="login-box">
<h1>Peak Music</h1>
<p>Honkai Star Rail Peak Music</p>

<form>
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>
<button type="submit">LOG IN</button>

<div class="links">
<a href="#">Forgot Password?</a><br>
<a href="#">Create Account</a>
</div>
</form>

<div class="footer">
Simple Spotify-style login • WebDev Project
</div>
</div>

</body>
</html>
